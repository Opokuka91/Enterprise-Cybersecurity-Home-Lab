<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
  <title id="title">pfSense Enterprise Firewall Lab Architecture</title>
  <desc id="desc">Network diagram showing Internet, VirtualBox NAT, PFSENSE-FW01 WAN and LAN interfaces, LAB-LAN, and the Windows 11 client.</desc>
  <defs>
    <style>
      .bg { fill: #f7fafc; }
      .zone { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .wan { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .fw { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; }
      .lan { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .client { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .heading { font: 700 20px Arial, sans-serif; fill: #0f172a; }
      .label { font: 600 17px Arial, sans-serif; fill: #0f172a; }
      .small { font: 14px Arial, sans-serif; fill: #334155; }
      .muted { font: 13px Arial, sans-serif; fill: #64748b; }
      .line { stroke: #334155; stroke-width: 3; fill: none; }
      .dash { stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 6; fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1100" height="720" />
  <text class="title" x="550" y="52" text-anchor="middle">Lab 001 - pfSense Enterprise Firewall</text>
  <text class="muted" x="550" y="78" text-anchor="middle">VirtualBox lab network with segmented WAN and LAN interfaces</text>

  <rect class="zone" x="70" y="115" width="960" height="540" rx="10" />
  <text class="heading" x="100" y="150">VirtualBox Host Environment</text>

  <rect class="wan" x="385" y="180" width="330" height="75" rx="8" />
  <text class="label" x="550" y="212" text-anchor="middle">VirtualBox NAT</text>
  <text class="small" x="550" y="236" text-anchor="middle">Upstream WAN network</text>

  <rect class="fw" x="340" y="330" width="420" height="125" rx="8" />
  <text class="label" x="550" y="365" text-anchor="middle">PFSENSE-FW01</text>
  <text class="small" x="550" y="391" text-anchor="middle">pfSense CE 2.8.1</text>
  <text class="small" x="430" y="424" text-anchor="middle">WAN em0</text>
  <text class="small" x="430" y="445" text-anchor="middle">10.0.2.15/24</text>
  <text class="small" x="670" y="424" text-anchor="middle">LAN em1</text>
  <text class="small" x="670" y="445" text-anchor="middle">10.10.10.1/24</text>

  <rect class="lan" x="385" y="520" width="330" height="65" rx="8" />
  <text class="label" x="550" y="548" text-anchor="middle">LAB-LAN</text>
  <text class="small" x="550" y="572" text-anchor="middle">Internal Network - 10.10.10.0/24</text>

  <rect class="client" x="760" y="520" width="215" height="85" rx="8" />
  <text class="label" x="867" y="550" text-anchor="middle">Windows 11 Client</text>
  <text class="small" x="867" y="575" text-anchor="middle">KAO-Tech-Windows11-Lab</text>
  <text class="small" x="867" y="596" text-anchor="middle">10.10.10.100/24</text>

  <rect class="zone" x="110" y="180" width="210" height="75" rx="8" />
  <text class="label" x="215" y="212" text-anchor="middle">Internet</text>
  <text class="small" x="215" y="236" text-anchor="middle">External connectivity</text>

  <path class="line" marker-end="url(#arrow)" d="M 320 217 L 385 217" />
  <path class="line" marker-end="url(#arrow)" d="M 550 255 L 550 330" />
  <path class="line" marker-end="url(#arrow)" d="M 550 455 L 550 520" />
  <path class="line" marker-end="url(#arrow)" d="M 715 552 L 760 552" />
  <path class="dash" d="M 670 455 C 690 485, 710 510, 760 552" />

  <text class="muted" x="550" y="300" text-anchor="middle">Adapter 1 - NAT - WAN</text>
  <text class="muted" x="550" y="500" text-anchor="middle">Adapter 2 - Internal Network - LAN</text>
  <text class="muted" x="867" y="630" text-anchor="middle">Receives DHCP from pfSense</text>
</svg>
